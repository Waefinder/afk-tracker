<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#e0e0e0;min-height:100vh}
.hdr{background:linear-gradient(135deg,#1a2940,#0f1923);padding:14px 20px;border-bottom:2px solid #f0c040;display:flex;align-items:center;gap:12px}
.hdr h1{font-size:18px;color:#f0c040}
.hdr .nav-links{display:flex;align-items:center;gap:8px;margin-left:auto}
.hdr .nav-btn{font-size:11px;font-weight:600;padding:4px 10px;border-radius:5px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:all .15s}
.hdr .nav-btn.active{color:#f0c040;border-color:#f0c040}
.hdr .nav-btn:not(.active){color:#667;border-color:#3a4a5a}
.hdr .nav-btn:not(.active):hover{color:#aaa;border-color:#667}
.ct{max-width:1200px;margin:0 auto;padding:16px}
/* Search bar */
.search-bar{margin-bottom:12px}
.search-bar input{width:100%;padding:10px 14px;background:#1a2940;border:1px solid #3a4a5a;border-radius:8px;color:#e0e0e0;font-size:14px;outline:none}
.search-bar input:focus{border-color:#f0c040}
/* Filter buttons */
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filter-btn{padding:5px 10px;border-radius:6px;border:1px solid #3a4a5a;background:#1a2940;color:#8899aa;font-size:12px;cursor:pointer;transition:all .15s}
.filter-btn:hover{border-color:#f0c040;color:#e0e0e0}
.filter-btn.active{background:#f0c040;color:#0f1923;border-color:#f0c040;font-weight:700}
.filter-label{font-size:11px;color:#667;font-weight:700;align-self:center;margin-right:4px}
/* Table */
.hero-table{width:100%;border-collapse:collapse;font-size:13px}
.hero-table th{background:#1a2940;color:#f0c040;padding:8px 6px;text-align:left;border-bottom:2px solid #f0c040;font-size:11px;position:sticky;top:0}
.hero-table td{padding:6px;border-bottom:1px solid #1a2530;vertical-align:middle}
.hero-table tr:hover{background:#1a2940}
.hero-cell{display:flex;align-items:center;gap:8px}
.hero-cell img{width:40px;height:40px;border-radius:6px;background:#2a3a4a;object-fit:cover}
.hero-cell .nm{font-weight:600;font-size:12px}
.hero-cell .meta{font-size:10px;color:#8899aa}
.faction-badge{padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;display:inline-block}
.faction-badge.lb{background:#3355aa;color:#fff}
.faction-badge.ma{background:#cc6633;color:#fff}
.faction-badge.wi{background:#33aa55;color:#fff}
.faction-badge.gr{background:#7744aa;color:#fff}
.faction-badge.ce{background:#aa8833;color:#fff}
.faction-badge.hy{background:#cc3355;color:#fff}
.faction-badge.di{background:#33aacc;color:#fff}
.rarity-badge{padding:2px 5px;border-radius:3px;font-size:10px;font-weight:700}
.rarity-badge.s{background:#f0c040;color:#0f1923}
.rarity-badge.a{background:#8866cc;color:#fff}
.class-badge{font-size:10px;color:#8899aa}
/* Tier select */
.tier-sel select{font-size:11px;padding:3px 4px;border-radius:4px;border:1px solid #3a4a5a;cursor:pointer;background:#1a2940;color:#e0e0e0}
.tier-sel select.s{background:#f0c040;color:#0f1923;border-color:#f0c040}
.tier-sel select.a{background:#8866cc;color:#fff;border-color:#8866cc}
/* +/- */
.cpy-row{display:flex;align-items:center;gap:3px}
.cpy-btn{width:22px;height:22px;border-radius:4px;border:1px solid #3a4a5a;background:#1a2940;color:#f0c040;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cpy-btn:hover{background:#2a3a5a}
.cpy-val{width:32px;text-align:center;font-size:12px;font-weight:700;background:#1a2940;border:1px solid #3a4a5a;border-radius:4px;padding:2px;cursor:pointer}
.need{font-size:11px;color:#8899aa}
.need strong{color:#f0c040}
.need.done{color:#66aa66}
/* Target select */
.tgt-sel select{font-size:10px;padding:2px 3px;border-radius:3px;border:1px solid #3a4a5a;background:#1a2940;color:#e0e0e0}
/* Status bar */
.status{font-size:12px;color:#8899aa;margin-bottom:12px;padding:6px 10px;background:#1a2940;border-radius:6px;border:1px solid #2a3a4a}
.status strong{color:#f0c040}
/* Empty state */
.empty{color:#556;font-size:12px;padding:40px;text-align:center}

var TI=["Elite","Elite+","Epic","Epic+","Legendary","Legendary+","Mythic","Mythic+","Supreme","Supreme+","P1","P2","P3","P4"];
var COST_A=[1,3,4,5,8,10,12,0,20];
var COST_S=[0,0,1,0,2,0,2,0,2];
var PARAGON_A=[45,45,68,68];
var PARAGON_S=[6,6,9,9];
var TH={};
function buildThresholds(){
  TH.A=[];TH.S=[];
  var ca=1,cs=1;
  TH.A[0]=1;TH.S[2]=1;
  for(var i=0;i<9;i++){ca+=COST_A[i];TH.A[i+1]=ca;}
  for(var i=2;i<9;i++){cs+=COST_S[i];TH.S[i+1]=cs;}
  var pa=64,ps=8;
  for(var p=0;p<4;p++){pa+=PARAGON_A[p];ps+=PARAGON_S[p];TH.A[10+p]=pa;TH.S[10+p]=ps;}
}
buildThresholds();

function getTier(copies,rarity){
  var t=(rarity==='A')?0:2;
  var th=TH[rarity];
  for(var i=t;i<14;i++){if(copies>=th[i])t=i;else break;}
  return t;
}
function copiesToNext(copies,rarity){
  var tier=getTier(copies,rarity);
  if(tier>=13)return -1;
  var th=TH[rarity];
  var nxt=th[tier+1];
  if(nxt===undefined)return -1;
  return Math.max(0,nxt-copies);
}
function copiesToTarget(copies,rarity,targetIdx){
  var th=TH[rarity];
  var tth=th[targetIdx];
  if(tth===undefined)return -1;
  return Math.max(0,tth-copies);
}
function clampCopies(c){
  var h=HS.find(function(x){return x.n===c.hero;});
  if(h){var max=(h.r==='A')?TH.A[13]:TH.S[13];if(c.copies>max)c.copies=max;}
}

// State (shared with page 1)
var KS="afk_wl_v2";
var state=JSON.parse(localStorage.getItem(KS)||"[]");

// Filters
var factionFilter="all", classFilter="all", searchQuery="";

// Faction colors
var FC={Lightbearer:"lb",Mauler:"ma",Wilder:"wi",Graveborn:"gr",Celestial:"ce",Hypogean:"hy",Dimensional:"di"};

function save(){localStorage.setItem(KS,JSON.stringify(state));}

// Get hero's state (find or create placeholder)
function getHeroState(name){
  var idx=-1;
  for(var i=0;i<state.length;i++){if(state[i].hero===name){idx=i;break;}}
  if(idx>=0)return {state:state[idx],index:idx};
  // Not in state: create temp entry
  return {state:{hero:name,faction:"?",rarity:"A",copies:0,targetIdx:13,tier:0},index:-1};
}

function setHeroState(name,field,val){
  var hs=getHeroState(name);
  if(hs.index>=0){
    state[hs.index][field]=val;
    if(field==="copies")clampCopies(state[hs.index]);
    save();
  }else{
    // Add to state
    var h=HS.find(function(x){return x.n===name;});
    var c={hero:name,faction:h?h.f:"?",rarity:h?h.r:"A",copies:0,targetIdx:13,tier:0};
    c[field]=val;
    state.push(c);
    save();
  }
}

// Get hero info
function getInfo(name){
  return HS.find(function(h){return h.n===name;});
}

// Render table
function render(){
  var tbody=document.getElementById("tbody");
  var html="";
  var count=0;
  HS.forEach(function(h){
    // Apply filters
    if(factionFilter!=="all"&&h.f!==factionFilter)return;
    if(classFilter!=="all"&&h.c!==classFilter)return;
    if(searchQuery&&!h.n.toLowerCase().includes(searchQuery.toLowerCase()))return;
    count++;
    var hs=getHeroState(h.n);
    var s=hs.state;
    var heroRarity=h.r||s.rarity;
    var tier=s.tier||getTier(s.copies,heroRarity);
    var startTier=(heroRarity==="A")?0:2;
    var need=copiesToNext(s.copies,heroRarity);
    var toTgt=copiesToTarget(s.copies,heroRarity,s.targetIdx);
    html+='<tr data-hero="'+h.n+'">';
    // Hero
    html+='<td><div class="hero-cell"><img src="'+h.img+'" onerror="this.style.display=\'none\'"><div><div class="nm">'+h.n+'</div><div class="meta">'+(h.f||'')+'</div></div></div></td>';
    // Faction
    html+='<td><span class="faction-badge '+(FC[h.f]||'')+'">'+h.f+'</span></td>';
    // Class
    html+='<td><span class="class-badge">'+h.c+'</span></td>';
    // Rarity
    html+='<td><span class="rarity-badge '+h.r.toLowerCase()+'">'+h.r+'</span></td>';
    // Tier dropdown
    html+='<td class="tier-sel"><select onchange="setTierOnHero(\''+h.n+'\',this.value)">';
    for(var t=startTier;t<14;t++){
      html+='<option value="'+t+'"'+(tier===t?' selected':'')+'>'+TI[t]+'</option>';
    }
    html+='</select></td>';
    // Copies +/-
    html+='<td><div class="cpy-row">';
    html+='<button class="cpy-btn" onclick="adjCopiesOnHero(\''+h.n+'\',-1)">−</button>';
    html+='<span class="cpy-val" onclick="editCopiesOnHero(\''+h.n+'\',this)">'+Math.max(0,s.copies-TH[heroRarity][tier])+'</span>';
    html+='<button class="cpy-btn" onclick="adjCopiesOnHero(\''+h.n+'\',1)">+</button>';
    html+='</div></td>';
    // Need
    html+='<td>'+(need>=0?'<div class="need">Need <strong>'+need+'</strong></div>':'<div class="need done">✓ Max</div>')+'</td>';
    // Target dropdown
    html+='<td class="tgt-sel"><select onchange="setTargetOnHero(\''+h.n+'\',this.value)">';
    for(var tt=startTier;tt<14;tt++){
      html+='<option value="'+tt+'"'+(s.targetIdx===tt?' selected':'')+'>'+TI[tt]+'</option>';
    }
    html+='</select></td>';
    // To target
    html+='<td>'+(toTgt>=0?'<div class="need">To target: <strong>'+toTgt+'</strong></div>':'<div class="need done">✓ Done</div>')+'</td>';
    html+='</tr>';
  });
  tbody.innerHTML=html;
  document.getElementById("empty").style.display=count===0?"block":"none";
  // Status
  var tracked=state.filter(function(s){return s.hero;}).length;
  document.getElementById("status").innerHTML="<strong>"+HS.length+"</strong> heroes total | <strong>"+tracked+"</strong> tracked in wishlist";
}

// Actions
function setTierOnHero(name,val){
  var h=HS.find(function(x){return x.n===name;});
  var tier=parseInt(val);
  var th=(h.r==="A")?TH.A[tier]:TH.S[tier];
  if(typeof th==="number")setHeroState(name,"copies",th);
  setHeroState(name,"tier",tier);
  render();
}
function adjCopiesOnHero(name,delta){
  var hs=getHeroState(name);
  var c=hs.state;
  var t1=c.tier||getTier(c.copies,c.rarity);
  var rem=c.copies-TH[c.rarity][t1]+delta;
  c.copies=TH[c.rarity][t1]+Math.max(0,rem);
  clampCopies(c);
  setHeroState(name,"copies",c.copies);
  var h=HS.find(function(x){return x.n===name;});
  var derived=getTier(c.copies,h?h.r:"A");
  if(derived>c.tier)setHeroState(name,"tier",derived);
  render();
}
function setTargetOnHero(name,val){
  setHeroState(name,"targetIdx",parseInt(val));
  render();
}
function editCopiesOnHero(name,el){
  var input=document.createElement("input");
  input.type="text";
  var hs=getHeroState(name);
  var hR=HS.find(function(x){return x.n===name;});
  var heroR=hR?hR.r:"A";
  var tierV=hs.state.tier||getTier(hs.state.copies,heroR);
  input.value=Math.max(0,hs.state.copies-TH[heroR][tierV]);
  el.innerHTML="";
  el.appendChild(input);
  input.focus();input.select();
  function commit(){
    var v=Math.max(0,Math.min(999,parseInt(input.value)||0));
    var hR2=HS.find(function(x){return x.n===name;});
    var heroR2=hR2?hR2.r:"A";
    var tierV2=getHeroState(name).state.tier||getTier(getHeroState(name).state.copies,heroR2);
    setHeroState(name,"copies",TH[heroR2][tierV2]+v);
    var h=HS.find(function(x){return x.n===name;});
    if(h){
      var derived=getTier(v,h.r);
      if(derived>hs.state.tier)setHeroState(name,"tier",derived);
    }
    render();
  }
  input.addEventListener("blur",commit);
  input.addEventListener("keydown",function(ev){if(ev.key==="Enter")input.blur();});
  input.addEventListener("input",function(){input.value=input.value.replace(/[^0-9]/g,"");});
}

// Filter buttons
document.querySelectorAll(".filter-btn").forEach(function(btn){
  btn.addEventListener("click",function(){
    var type=btn.getAttribute("data-filter");
    var val=btn.getAttribute("data-val");
    // Toggle active within same group
    btn.parentElement.querySelectorAll(".filter-btn").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");
    if(type==="faction")factionFilter=val;
    if(type==="class")classFilter=val;
    render();
  });
});

// Search
document.getElementById("search").addEventListener("input",function(e){
  searchQuery=e.target.value;
  render();
});

// Back link
render();
</script>
</body>
