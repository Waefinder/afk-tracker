<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#e0e0e0;min-height:100vh}
.hdr{background:linear-gradient(135deg,#1a2940,#0f1923);padding:14px 20px;border-bottom:2px solid #f0c040;display:flex;align-items:center;gap:12px}
.hdr h1{font-size:18px;color:#f0c040}.hdr .st{margin-left:auto;font-size:13px;color:#8899aa}
.ct{max-width:960px;margin:0 auto;padding:16px}
.sb{position:relative;margin-bottom:16px}.sb input{width:100%;padding:12px 16px 12px 40px;background:#1a2940;border:1px solid #2a3a4a;border-radius:8px;color:#fff;font-size:15px;outline:none}.sb input:focus{border-color:#f0c040}
.sb::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px}
.dd{position:absolute;top:100%;left:0;right:0;background:#1a2940;border:1px solid #2a3a4a;border-radius:0 0 8px 8px;max-height:300px;overflow-y:auto;z-index:100;display:none}.dd.sh{display:block}
.di{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #1a2530}.di:hover{background:#2a3a4a}
.di img{width:40px;height:40px;border-radius:6px;background:#2a3a4a}.di .nm{font-size:14px;font-weight:600}.di .fc{font-size:12px;color:#8899aa}
.fh{font-size:14px;font-weight:700;color:#f0c040;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid #2a3a4a;display:flex;align-items:center;gap:8px}
.fh .cnt{font-size:12px;color:#667;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:8px;margin-bottom:8px}
.hero{background:#1a2940;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid #2a3a4a;transition:all .15s;position:relative}
.hero:hover{border-color:#4488cc;transform:scale(1.05)}
.hero img{width:100%;aspect-ratio:1;object-fit:cover;background:#2a3a4a;display:block}
.hero .nm{font-size:10px;text-align:center;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.hero .mx{position:absolute;top:2px;right:2px;background:#22aa44;color:#fff;font-size:7px;font-weight:700;padding:1px 3px;border-radius:3px}
.hero .lv{position:absolute;top:2px;left:2px;font-size:7px;font-weight:700;padding:1px 3px;border-radius:3px}
.hero .lv.s{background:#f0c040;color:#0f1923}.hero .lv.a{background:#8866cc;color:#fff}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
.modal.show{display:flex}
.mcard{background:#1a2940;border-radius:16px;padding:24px;max-width:480px;width:92%;max-height:90vh;overflow-y:auto;border:2px solid #f0c040;position:relative}
.close{position:absolute;top:10px;right:14px;background:none;border:none;color:#8899aa;font-size:28px;cursor:pointer;line-height:1}
.close:hover{color:#fff}
.mtop{display:flex;gap:16px;margin-bottom:16px}
.mimg{width:100px;height:100px;border-radius:12px;background:#2a3a4a;border:2px solid #f0c040;object-fit:cover}
.minfo h2{font-size:20px;color:#f0c040;margin-bottom:6px}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.t{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase}
.t.s{background:#f0c040;color:#0f1923}.t.a{background:#8866cc;color:#fff}
.tfc{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.tlb{background:#3355aa;color:#fff}.tma{background:#cc6633;color:#fff}.twi{background:#33aa55;color:#fff}
.tgr{background:#7744aa;color:#fff}.tce{background:#aa8833;color:#fff}.thy{background:#cc3355;color:#fff}.tdi{background:#33aacc;color:#fff}
.cls{font-size:12px;color:#8899aa}
.tl{font-size:12px;color:#8899aa;margin:14px 0 6px}
.tb{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.ts{min-width:40px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;cursor:pointer;border:2px solid #2a3a4a;background:#1a2530;color:#556677;transition:all .15s}
.ts.dn{background:#2255aa;border-color:#4488cc;color:#fff}
.ts.cr{border-color:#f0c040;color:#f0c040;background:#1a3050}
.ci{display:flex;align-items:center;gap:8px;margin-top:10px}
.ci button{width:30px;height:30px;border-radius:6px;border:1px solid #2a3a4a;background:#1a2530;color:#f0c040;font-size:18px;cursor:pointer}.ci button:hover{background:#2a3a4a}
.ci span{font-size:18px;font-weight:700;min-width:24px;text-align:center}
.cn{margin-top:8px;font-size:13px;color:#8899aa}.cn strong{color:#f0c040}
.pb{margin-top:14px;padding-top:12px;border-top:1px solid #2a3a4a}.pb .tl{color:#f0c040}
.lt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
.lt input[type=checkbox]{accent-color:#f0c040;width:16px;height:16px}
.wn{color:#ff6644;font-size:12px;margin-top:4px}
.fc2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fcc{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .15s}
.fcc:hover{opacity:.8}.fcc.active{border-color:#fff}
.cost-info{font-size:11px;color:#667788;margin-top:4px;line-height:1.4}
.es{text-align:center;padding:40px 20px;color:#556677}</style>
</head>

var data=JSON.parse(localStorage.getItem("afk9")||"{}");
function sv(){localStorage.setItem("afk9",JSON.stringify(data))}
function getTier(copies,rarity){
var u;
if(rarity==="A")u=[1,3,4,5,8,10,12,20];
else if(rarity==="S")u=[0,0,1,0,2,0,2,0,2];
else u=[1,1,1,1,2,2,2,4];
var t=0,c=0;
for(var i=0;i<u.length;i++){c+=u[i];if(copies>=c)t=i+1}
return t}
function getCost(rarity,idx){var c;if(rarity==="A")c=[1,3,4,5,8,10,12,200,20];else if(rarity==="S")c=[0,0,1,50,2,100,2,200,2];else c=[0,0,1,1,1,1,2,2,2,4];return idx<c.length?c[idx]:0}

var fm=null,selH=null;
function rDD(q){var dd=document.getElementById("dd");if(!q){dd.classList.remove("sh");return}var m=HS.filter(h=>h.n.toLowerCase().indexOf(q.toLowerCase())>=0).slice(0,20);if(!m.length){dd.classList.remove("sh");return}dd.innerHTML=m.map(h=>'<div class="di" onclick="openM(\''+h.n+'\')"><img src="'+h.img+'"><div><div class="nm">'+h.n.replace(/_/g," ")+'</div><div class="fc">'+h.f+'</div></div></div>').join("");dd.classList.add("sh")}
function rFC(){document.getElementById("fc").innerHTML=FA.map(f=>{var c=HS.filter(h=>h.f===f).length;return '<div class="fcc t'+FC[f]+(fm===f?" active":"")+'" onclick="sF(\''+f+'\')">'+f+' ('+c+')</div>'}).join("")}
function sF(f){fm=f===fm?null:f;document.getElementById("sr").value="";document.getElementById("dd").classList.remove("sh");rFC();rGH()}
function rGH(){var el=document.getElementById("hl");if(!fm){el.innerHTML="";return}var heroes=HS.filter(h=>h.f===fm);el.innerHTML='<div class="fh">'+fm+'<span class="cnt">('+heroes.length+')</span></div><div class="grid">'+heroes.map(h=>{var d=data[h.n]||{c:0,l:false},ti=getTier(d.c,h.r);var mx=d.c>=30?'<div class="mx">MAX</div>':'';return '<div class="hero" onclick="openM(\''+h.n+'\')"><img src="'+h.img+'"><div class="nm">'+h.n.replace(/_/g," ")+'</div><div class="lv '+h.r.toLowerCase()+'">'+h.r+'</div>'+mx+'</div>'}).join("")+'</div>'}
function openM(n){var h=HS.find(x=>x.n===n);if(!h)return;selH=h;var d=data[h.n]||{c:0,l:false},ti=getTier(d.c,h.r);
var s='<button class="close" onclick="closeM()">&times;</button>';
s+='<div class="mtop"><img class="mimg" src="'+h.img+'"><div class="minfo"><h2>'+h.n.replace(/_/g," ")+'</h2><div class="tg"><span class="t '+h.r.toLowerCase()+'">'+h.r+'-Level</span><span class="tfc t'+FC[h.f]+'">'+h.f+'</span></div><div class="cls">'+h.c+'</div></div></div>';
s+='<div class="tl">Ascension Tier</div><div class="tb">';
TI.forEach((t,i)=>s+='<div class="ts'+(i<ti?' dn':'')+(i===ti?' cr':'')+'" onclick="setC(\''+h.n+'\','+(i+1)+')" title="'+t+'">'+["Elite","Elite+","Epic","Epic+","Legd","Leg+","Myth","My+","Supr","Su+","P1","P2","P3","P4"][i]+'</div>');
s+='</div>';
if(ti<TI.length){var nxt=ti;var cost="";
cost="Next: "+getCost(h.r,nxt)+" Sigils";
s+='<div class="cost-info">'+cost+'</div>'}
s+='<div class="ci"><span class="tl" style="margin:0">Copies/Sigils:</span><button onclick="aC(\''+h.n+'\',-1)">-</button><span>'+d.c+'</span><button onclick="aC(\''+h.n+'\',1)">+</button></div>';
s+='<div class="cn">'+(ti<10?'Need <strong>'+(10-ti)+'</strong> more to Supreme+':'Done!')+'</div>';
s+='';
s+='<div class="lt"><input type="checkbox" id="lc" '+(d.l?'checked':'')+' onchange="setL(\''+h.n+'\',this.checked)"><label for="lc">Stop at P3?</label></div>';
if(d.l)s+='<div class="wn">Do not invest past Paragon 3</div>';
document.getElementById("mc").innerHTML=s;document.getElementById("modal").classList.add("show")}
function closeM(){document.getElementById("modal").classList.remove("show");selH=null}
function aC(k,d){var d2=data[k]||{c:0,l:false};d2.c=Math.max(0,Math.min(30,d2.c+d));data[k]=d2;sv();if(selH)openM(selH.n);uS()}
function setC(k,v){var d2=data[k]||{c:0,l:false};d2.c=v;data[k]=d2;sv();if(selH)openM(selH.n);uS()}
function setL(k,v){var d2=data[k]||{c:0,l:false};d2.l=v;data[k]=d2;sv();if(selH)openM(selH.n)}
function uS(){var tot=HS.length,sp=0;HS.forEach(h=>{var d=data[h.n];if(d&&d.c>=10)sp++});document.getElementById("gs").textContent=sp+'/'+tot+' Supreme+'}
document.getElementById("sr").addEventListener("input",e=>{fm=null;rFC();rDD(e.target.value);var q=e.target.value.toLowerCase();if(q){var el=document.getElementById("hl");var m=HS.filter(h=>h.n.toLowerCase().indexOf(q)>=0).slice(0,30);el.innerHTML='<div class="grid">'+m.map(h=>'<div class="hero" onclick="openM(\''+h.n+'\')"><img src="'+h.img+'"><div class="nm">'+h.n.replace(/_/g," ")+'</div><div class="lv '+h.r.toLowerCase()+'">'+h.r+'</div></div>').join("")+'</div>'}});
document.addEventListener("click",e=>{if(!e.target.closest(".sb"))document.getElementById("dd").classList.remove("sh");if(e.target===document.getElementById("modal"))closeM()});
uS();rFC();</script>
