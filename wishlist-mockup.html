<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFK Journey - Wish List Tracker v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#e0e0e0;min-height:100vh}
.hdr{background:linear-gradient(135deg,#1a2940,#0f1923);padding:14px 20px;border-bottom:2px solid #f0c040;display:flex;align-items:center;gap:12px}
.hdr h1{font-size:18px;color:#f0c040}
.ct{max-width:960px;margin:0 auto;padding:16px}
/* Grid: 4 rows (factions) x 4 cols (S1,S2,A1,A2) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.grid-header{font-size:11px;font-weight:700;color:#8899aa;text-align:center;padding:6px 0;border-bottom:1px solid #2a3a4a}
.row-label{grid-column:1/-1;font-size:13px;font-weight:700;color:#f0c040;padding:8px 0 4px;border-top:1px solid #2a3a4a;margin-top:4px}
.cell{background:#121d2b;border-radius:10px;padding:10px 6px;text-align:center;border:2px solid #2a3a4a;transition:all .15s;position:relative;min-height:200px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.cell:hover{border-color:#4488cc}
.cell.empty{border-style:dashed;opacity:.6}
.cell.empty:hover{opacity:1}
.cell img{width:80px;height:80px;object-fit:cover;border-radius:8px;background:#2a3a4a;display:block;margin-bottom:4px}
.cell .nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cell .tier{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700;display:inline-block;margin:2px 0}
.cell .tier.s{background:#f0c040;color:#0f1923}
.cell .tier.a{background:#8866cc;color:#fff}
.cell .need{font-size:9px;color:#8899aa}
.cell .need strong{color:#f0c040}
.cell .need.done{color:#66aa66}
/* +/- row */
.cpy-row{display:flex;align-items:center;gap:4px;margin:4px 0}
.cpy-btn{width:24px;height:24px;border-radius:4px;border:1px solid #3a4a5a;background:#1a2940;color:#f0c040;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cpy-btn:hover{background:#2a3a5a}
.cpy-val{width:36px;text-align:center;font-size:12px;font-weight:700;color:#e0e0e0;background:#1a2940;border:1px solid #3a4a5a;border-radius:4px;padding:2px;cursor:pointer}
.cpy-val input{width:36px;text-align:center;font-size:12px;font-weight:700;color:#e0e0e0;background:#1a2940;border:1px solid #f0c040;border-radius:4px;padding:2px;outline:none}
/* target */
.tgt-row{font-size:9px;color:#8899aa;margin-top:2px}
.tgt-row select{font-size:9px;background:#1a2940;color:#e0e0e0;border:1px solid #3a4a5a;border-radius:3px;padding:1px 2px;cursor:pointer}
/* popup */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:999}
.popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a2940;border:2px solid #f0c040;border-radius:14px;z-index:1000;max-width:500px;width:92vw;max-height:80vh;overflow:hidden}
.popup-hdr{padding:12px 16px;border-bottom:1px solid #2a3a4a;display:flex;justify-content:space-between;align-items:center}
.popup-hdr h3{font-size:14px;color:#f0c040}
.popup-close{background:none;border:none;color:#ff6644;font-size:20px;cursor:pointer;padding:0 6px}
.popup-filters{display:none}
.popup-list{padding:8px;overflow-y:auto;max-height:55vh}
.popup-hero{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.popup-hero:hover{background:#121d2b;border-color:#4488cc}
.popup-hero.active{border-color:#f0c040;background:#1a2930}
.popup-hero img{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#2a3a4a}
.popup-hero .ph-info{flex:1}
.popup-hero .ph-name{font-size:11px;font-weight:600}
.popup-hero .ph-meta{font-size:9px;color:#8899aa}
.popup-hero .ph-placed{font-size:8px;color:#f0c040;font-weight:600}
</style>
</head>
<body>

<div class="ct" id="app"></div>
<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
  <div class="popup-hdr"><h3 id="popupTitle">Select Hero</h3><button class="popup-close" onclick="closePopup()">✕</button></div>
  <div class="popup-list" id="popupList"></div>

ort",img:"img/Rowan.webp"},{n:"Saida",f:"Hypogean",r:"S",c:"Rogue",img:"img/Saida.webp"},{n:"Salazer",f:"Graveborn",r:"A",c:"Rogue",img:"img/Salazer.webp"},{n:"Satrana",f:"Mauler",r:"A",c:"Mage",img:"img/Satrana.webp"},{n:"Scarlita",f:"Celestial",r:"S",c:"Warrior",img:"img/Scarlita.webp"},{n:"Senea",f:"Graveborn",r:"S",c:"Marksman",img:"img/Senea.webp"},{n:"Seth",f:"Mauler",r:"A",c:"Rogue",img:"img/Seth.webp"},{n:"Shadewing",f:"Graveborn",r:"A",c:"Rogue",img:"img/Shadewing.webp"},{n:"Shakir",f:"Mauler",r:"S",c:"Rogue",img:"img/Shakir.webp"},{n:"Shemira",f:"Graveborn",r:"S",c:"Mage",img:"img/Shemira.webp"},{n:"Silven",f:"Lightbearer",r:"A",c:"Marksman",img:"img/Silven.webp"},{n:"Silvina",f:"Graveborn",r:"A",c:"Rogue",img:"img/Silvina.webp"},{n:"Sinbad",f:"Lightbearer",r:"A",c:"Rogue",img:"img/Sinbad.webp"},{n:"Smokey_Meerky",f:"Mauler",r:"S",c:"Support",img:"img/Smokey_Meerky.webp"},{n:"Solise",f:"Wilder",r:"S",c:"Support",img:"img/Solise.webp"},{n:"Sonja",f:"Lightbearer",r:"S",c:"Warrior",img:"img/Sonja.webp"},{n:"Soren",f:"Mauler",r:"A",c:"Rogue",img:"img/Soren.webp"},{n:"Sylphira",f:"Celestial",r:"S",c:"Rogue",img:"img/Sylphira.webp"},{n:"Taichi_Agumon",f:"Dimensional",r:"S",c:"Warrior",img:"img/Taichi_Agumon.webp"},{n:"Talene",f:"Celestial",r:"S",c:"Mage",img:"img/Talene.webp"},{n:"Tasi",f:"Wilder",r:"S",c:"Mage",img:"img/Tasi.webp"},{n:"Temesia",f:"Lightbearer",r:"S",c:"Tank",img:"img/Temesia.webp"},{n:"Thador",f:"Wilder",r:"A",c:"Tank",img:"img/Thador.webp"},{n:"Thoran",f:"Graveborn",r:"S",c:"Tank",img:"img/Thoran.webp"},{n:"Tilaya",f:"Wilder",r:"A",c:"Warrior",img:"img/Tilaya.webp"},{n:"Ulmus",f:"Wilder",r:"A",c:"Tank",img:"img/Ulmus.webp"},{n:"Vala",f:"Lightbearer",r:"S",c:"Rogue",img:"img/Vala.webp"},{n:"Valen",f:"Lightbearer",r:"A",c:"Warrior",img:"img/Valen.webp"},{n:"Valka",f:"Graveborn",r:"A",c:"Warrior",img:"img/Valka.webp"},{n:"Velara",f:"Wilder",r:"S",c:"Support",img:"img/Velara.webp"},{n:"Viperian",f:"Graveborn",r:"A",c:"Mage",img:"img/Viperian.webp"},{n:"Voracia",f:"Mauler",r:"S",c:"Mage",img:"img/Voracia.webp"},{n:"Walker",f:"Lightbearer",r:"A",c:"Rogue",img:"img/Walker.webp"},{n:"Yamato_Gabumon",f:"Dimensional",r:"S",c:"Mage",img:"img/Yamato_Gabumon.webp"},{n:"Zandrok",f:"Mauler",r:"S",c:"Warrior",img:"img/Zandrok.webp"},{n:"Zanie",f:"Lightbearer",r:"A",c:"Marksman",img:"img/Zanie.webp"},{n:"Zorya",f:"Graveborn",r:"S",c:"Warrior",img:"img/Zorya.webp"}];

var TI=["Elite","Elite+","Epic","Epic+","Legendary","Legendary+","Mythic","Mythic+","Supreme","Supreme+","P1","P2","P3","P4"];
var COST_A=[1,3,4,5,8,10,12,0,20];
var COST_S=[0,0,1,0,2,0,2,0,2];
var PARAGON_A=[45,45,68,68];
var PARAGON_S=[6,6,9,9];
var FACTIONS=["Lightbearer","Mauler","Wilder","Graveborn"];
var FA={Lightbearer:{icon:"✨",cls:"lb"},Mauler:{icon:"🔥",cls:"ma"},Wilder:{icon:"🌿",cls:"wi"},Graveborn:{icon:"💀",cls:"gr"}};

// thresholds[r][tierIdx] = total copies needed to be at that tier
var TH={};
function buildThresholds(){
  TH.A=[];TH.S=[];
  var ca=1,cs=1;
  TH.A[0]=1;TH.S[2]=1;
  for(var i=0;i<9;i++){ca+=COST_A[i];TH.A[i+1]=ca;}
  for(var i=2;i<9;i++){cs+=COST_S[i];TH.S[i+1]=cs;}
  var pa=64,ps=8;
  for(var p=0;p<4;p++){pa+=PARAGON_A[p];ps+=PARAGON_S[p];TH.A[10+p]=pa;TH.S[10+p]=ps;}
}
buildThresholds();

function getTier(copies,rarity){
  var t=(rarity==='A')?0:2;
  var th=TH[rarity];
  for(var i=t;i<14;i++){if(copies>=th[i])t=i;else break;}
  return t;
}
function copiesToNext(copies,rarity){
  var tier=getTier(copies,rarity);
  if(tier>=13)return -1;
  var th=TH[rarity];
  var nxt=th[tier+1];
  if(nxt===undefined)return -1;
  return Math.max(0,nxt-copies);
}
function copiesToTarget(copies,rarity,targetIdx){
  var th=TH[rarity];
  var tth=th[targetIdx];
  if(tth===undefined)return -1;
  return Math.max(0,tth-copies);
}

// State: array of 16 cells (4 factions x 4 slots each)
var state=JSON.parse(localStorage.getItem("afk_wl_v2")||"null");
var KS="afk_wl_v2";

// Default 16 heroes from v1 (order: per faction, S first then A)
var INIT_HEROS={
  "Lightbearer":[{n:"Rowan",r:"S"},{n:"Vala",r:"S"},{n:"Atalanta",r:"S"},{n:"Korin",r:"A"}],
  "Mauler":[{n:"Shakir",r:"S"},{n:"Mikola",r:"S"},{n:"Odie",r:"A"},{n:"Gerda",r:"A"}],
  "Wilder":[{n:"Hewynn",r:"S"},{n:"Eironn",r:"S"},{n:"Florabelle",r:"S"},{n:"Arden",r:"A"}],
  "Graveborn":[{n:"Cecia",r:"S"},{n:"Thoran",r:"S"},{n:"Igor",r:"S"},{n:"Silvina",r:"A"}]
};
function initDefault(){
  var s=[];
  FACTIONS.forEach(function(faction){
    var heroes=INIT_HEROS[faction]||[];
    for(var i=0;i<4;i++){
      if(i<heroes.length){
        s.push({hero:heroes[i].n,faction:faction,rarity:heroes[i].r,copies:1,targetIdx:13});
      }else{
        s.push({hero:null,faction:faction,rarity:(i<2?'S':'A'),copies:1,targetIdx:13});
      }
    }
  });
  return s;
}

function save(){localStorage.setItem(KS,JSON.stringify(state));}

function getHero(name){return HS.find(function(h){return h.n===name;});}

function render(){
  var html='';
  // Column headers
  html+='<div class="grid">';
  html+='<div class="grid-header">S-Level</div><div class="grid-header">S-Level</div>';
  html+='<div class="grid-header">A-Level</div><div class="grid-header">A-Level</div>';
  
  FACTIONS.forEach(function(faction,fi){
    html+='<div class="row-label">'+FA[faction].icon+' '+faction+'</div>';
    for(var ci=0;ci<4;ci++){
      var idx=fi*4+ci;
      var cell=state[idx];
      var hero=getHero(cell.hero);
      if(!hero){
        html+='<div class="cell empty" onclick="openPopup('+idx+')"><div style="font-size:30px;margin:20px 0">+</div><div style="font-size:10px;color:#8899aa">Add Hero</div></div>';
      }else{
        var tier=getTier(cell.copies,hero.r);
        var tierName=TI[tier];
        var need=copiesToNext(cell.copies,hero.r);
        var toTarget=copiesToTarget(cell.copies,hero.r,cell.targetIdx);
        html+='<div class="cell" onclick="openPopup('+idx+')">';
        html+='<img src="'+hero.img+'" onerror="this.style.display=\'none\'">';
        html+='<div class="nm">'+hero.n+'</div>';
        html+='<div class="tier '+hero.r.toLowerCase()+'">'+tierName+'</div>';
        if(need>=0){html+='<div class="need">Need <strong>'+need+'</strong> more</div>';}
        else{html+='<div class="need done">✓ Max</div>';}
        html+='<div class="cpy-row">';
        html+='<button class="cpy-btn" onclick="event.stopPropagation();adjCopies('+idx+',-1)">−</button>';
        html+='<span class="cpy-val" onclick="editCopies(event,'+idx+')">'+cell.copies+'</span>';
        html+='<button class="cpy-btn" onclick="event.stopPropagation();adjCopies('+idx+',1)">+</button>';
        html+='</div>';
        // target dropdown
        html+='<div class="tgt-row">Target: ';
        var startTier=(hero.r==='A')?0:2;
        html+='<select onclick="event.stopPropagation()" onchange="setTarget('+idx+',this.value)">';
        for(var t=startTier;t<14;t++){
          html+='<option value="'+t+'"'+(cell.targetIdx===t?' selected':'')+'>'+TI[t]+'</option>';
        }
        html+='</select>';
        html+='</div>';
        html+='<div class="need" style="margin-top:2px">To target: <strong>'+toTarget+'</strong></div>';
        html+='</div>';
      }
    }
  });
  html+='</div>';
  document.getElementById('app').innerHTML=html;
}

function adjCopies(idx,delta){
  var c=state[idx];
  c.copies=Math.max(1,c.copies+delta);
  clampCopies(c);
  save();render();
}
function clampCopies(cell){
  var hero=getHero(cell.hero);
  if(hero){
    var maxTier=(hero.r==='A')?TH.A[13]:TH.S[13];
    if(cell.copies>maxTier)cell.copies=maxTier;
  }
}
function editCopies(e,idx){
  e.stopPropagation();
  var span=e.currentTarget;
  var input=document.createElement('input');
  input.type='text';
  input.value=state[idx].copies;
  span.innerHTML='';
  span.appendChild(input);
  setTimeout(function(){input.focus();},0);
  function commit(){
    if(document.activeElement===input)input.blur();
    var v=Math.min(999,Math.max(0,parseInt(input.value)||0));
    state[idx].copies=v;
    clampCopies(state[idx]);
    save();render();
  }
  input.addEventListener('focus',function(){input.select();});
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',function(ev){if(ev.key==='Enter')ev.target.blur();});
  input.addEventListener('input',function(){var d=input.value.replace(/[^0-9]/g,'');if(d!==input.value)input.value=d;});
}

function setTarget(idx,val){
  state[idx].targetIdx=parseInt(val);
  save();render();
}

// Popup — auto-filter by cell's faction + rarity, no manual filters
var popupIdx=null;
function openPopup(idx){
  popupIdx=idx;
  var cell=state[idx];
  document.getElementById('overlay').style.display='block';
  document.getElementById('popup').style.display='block';
  renderPopup(cell.faction,cell.rarity);
}
function closePopup(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('popup').style.display='none';
  popupIdx=null;
}
function selectHero(name){
  var cell=state[popupIdx];
  cell.hero=name;
  var hero=getHero(name);
  if(hero)cell.rarity=hero.r;
  save();closePopup();render();
}
function renderPopup(faction,rarity){
  document.getElementById('popupTitle').textContent=faction+' / '+rarity+'-Level';
  var heroes=HS.filter(function(h){return h.f===faction&&h.r===rarity;});
  var placed={};state.forEach(function(c){if(c.hero)placed[c.hero]=true;});
  var html='';
  heroes.forEach(function(h){
    var cls=placed[h.n]?' active':'';
    html+='<div class="popup-hero'+cls+'" onclick="selectHero(&#39;'+h.n+'&#39;)">';
    html+='<img src="'+h.img+'">';
    html+='<div class="ph-info"><div class="ph-name">'+h.n+'</div>';
    html+='<div class="ph-meta">'+h.f+' / '+h.r+'</div></div>';
    if(placed[h.n])html+='<div class="ph-placed">IN USE</div>';
    html+='</div>';
  });
  if(!heroes.length)html='<div style="padding:20px;text-align:center;color:#8899aa">No heroes found</div>';
  document.getElementById('popupList').innerHTML=html;
}

if(!state){state=initDefault();save();}
render();
</script>
