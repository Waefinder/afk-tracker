<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>cloud test</title></head><body>
<script>
// preset: token + gist set, local afk9 has a NEWER ts than cloud (cloud must be ignored)
localStorage.setItem('cloud_tok','TESTTOKEN');
localStorage.setItem('cloud_gist','TESTGIST');
localStorage.setItem('afk9',JSON.stringify({LocalHero:{c:5,l:false}}));
localStorage.setItem('afk9__ts',String(Date.now()+999999)); // local newer
localStorage.removeItem('afk_wl_v2'); localStorage.removeItem('afk_wl_v2__ts');

window.__calls=[];
var CLOUD={d:{afk9:JSON.stringify({CloudHero:{c:1}}),
              afk_wl_v2:JSON.stringify([{hero:'Rowan',copies:99}])},
           t:{afk9:Date.now()-1000000, afk_wl_v2:Date.now()+100000}};
window.fetch=function(url,opts){
  window.__calls.push({url:url,method:opts.method||'GET',body:opts.body||null});
  if((opts.method||'GET')==='GET')
    return Promise.resolve({ok:true,json:function(){return Promise.resolve({files:{'afk-state.json':{content:JSON.stringify(CLOUD)}}});}});
  return Promise.resolve({ok:true,json:function(){return Promise.resolve({id:'x'});}});
};
</script>
<script src="cloud.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){setTimeout(function(){
  var out={};
  out.button=document.querySelector('button[title*=cloud]')?'shown':'MISSING';
  out.cloudNewerApplied=(localStorage.getItem('afk_wl_v2')||'').includes('99');   // must be true
  out.cloudOlderIgnored=(localStorage.getItem('afk9')||'').includes('LocalHero'); // must be true
  out.authHeader='pending';
  // trigger a state write -> debounced PATCH after 1.5s
  localStorage.setItem('afk_rc_v1',JSON.stringify({'Aster':13}));
  setTimeout(function(){
    var patch=window.__calls.filter(function(c){return c.method==='PATCH';})[0];
    out.saveFired=!!patch;
    out.saveUrl=patch?patch.url.replace('https://api.github.com',''):null;
    var body=patch?JSON.parse(patch.body):{files:{}};
    out.saveHasRc=!!(body.files&&body.files['afk-state.json']&&body.files['afk-state.json'].content.indexOf('Aster')>=0);
    out.saveHasWl=!!(body.files&&body.files['afk-state.json']&&body.files['afk-state.json'].content.indexOf('Rowan')>=0);
    out.getAuth=(window.__calls.filter(function(c){return c.method==='GET';})[0]||{}).auth||null;
    out.getCallMade=window.__calls.some(function(c){return c.method==='GET';});
    // clear test pollution
    ['cloud_tok','cloud_gist','afk9','afk9__ts','afk_wl_v2','afk_wl_v2__ts','afk_rc_v1','afk_rc_v1__ts'].forEach(function(k){localStorage.removeItem(k);});
    document.body.textContent='RESULT:'+JSON.stringify(out,null,1);
  },2200);
},100);});
</script>
</body></html>
